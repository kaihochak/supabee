name: Release and publish npm package

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry publishing (leave blank to update the release PR)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  release:
    if: github.repository == 'kaihochak/supabee' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name || inputs.tag }}
      ref: ${{ steps.release.outputs.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) }}
    steps:
      - name: Check release bot configuration
        if: inputs.tag == ''
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo '::error::Add the RELEASE_PLEASE_TOKEN repository secret. See docs/publishing.md.'
            exit 1
          fi

      - name: Prepare a release PR or release a merged PR
        if: inputs.tag == ''
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: prod
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release tag, metadata, and prod ancestry
        id: release
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/check-release.mjs

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11

      - name: Install package dependencies
        run: npm ci

      - name: Build and pack release
        id: pack
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tarball = path.join(process.env.RUNNER_TEMP, `${pkg.name}-${pkg.version}.tgz`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\n`);
          NODE

      - name: Smoke test the packed CLI in a clean directory
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          smoke_dir="$(mktemp -d)"
          npm install --prefix "$smoke_dir" --ignore-scripts --no-audit --no-fund "$TARBALL"
          "$smoke_dir/node_modules/.bin/supabee" --help
          test "$("$smoke_dir/node_modules/.bin/supabee" --version)" = "$EXPECTED_VERSION"
          "$smoke_dir/node_modules/.bin/supabase-splitter" --help

      - name: Publish the tested tarball to npm
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --provenance
